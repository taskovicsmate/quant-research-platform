services:
  db-test:
    image: timescale/timescaledb:latest-pg17
    container_name: quant-db-test

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quant_research_test

    ports:
      - "5433:5432"

    volumes:
      - postgres_test_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quant_research_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_test_data:
