version: "3.9"

services:
  db:
    image: timescale/timescaledb:latest-pg17
    container_name: quant-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quant_research

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api-service:
    build:
      context: ./services/api-service

    container_name: quant-api

    ports:
      - "8000:8000"

    volumes:
      - ./services/api-service:/app

    env_file:
      - .env

    depends_on:
      - db

volumes:
  postgres_data: